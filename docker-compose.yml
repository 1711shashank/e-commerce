  ui:
    build:
      context: ./src/ui
      dockerfile: Dockerfile
      args:
        # Empty = same-origin /api (works on both localhost and admin.localhost via nginx)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://admin.localhost}
        AUTH_SERVICE_URL: http://auth-service:8001
        CATALOG_SERVICE_URL: http://catalog-service:8002
    container_name: ui
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://admin.localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
      STORE_HOSTS: ${STORE_HOSTS:-localhost,127.0.0.1,www.localhost}
      AUTH_SERVICE_URL: http://auth-service:8001
      CATALOG_SERVICE_URL: http://catalog-service:8002
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    networks:
      - app_net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ui:
        condition: service_started
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    networks:
      - app_net

volumes:
  auth_db_data:
  catalog_db_data:
  # inventory_db_data:
  # order_db_data:
  # payment_db_data:
  # redis_data:

networks:
  app_net:
    driver: bridge
