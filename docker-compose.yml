  auth-service:
    build:
      context: ./src/backend
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    env_file:
      - src/backend/.env
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8001"
    depends_on:
      auth_db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8001), 2); s.close()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - app_net
    restart: unless-stopped

  catalog-service:
    build:
      context: ./src/backend
      dockerfile: services/catalog-service/Dockerfile
    container_name: catalog-service
    env_file:
      - src/backend/.env
    environment:
      # CATALOG_DB_PORT in .env is the host-mapped port (5433); inside the network postgres listens on 5432.
      CATALOG_DB_PORT: "5432"
    ports:
      - "${CATALOG_SERVICE_PORT:-8002}:8002"
    depends_on:
      catalog_db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/products/', timeout=3)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - app_net
    restart: unless-stopped

