# Active stack: auth + catalog + UI + nginx + Redis + Celery worker
# Uncomment inventory/order/payment DBs (and their services) when those phases are built.

x-auth-service-env: &auth-service-env
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-change-me-auth-django-secret}
  AUTH_DEBUG: ${AUTH_DEBUG:-True}
  AUTH_ALLOWED_HOSTS: ${AUTH_ALLOWED_HOSTS:-localhost,127.0.0.1,auth-service,admin.localhost,www.localhost}
  AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
  AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
  AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password}
  AUTH_DB_HOST: auth_db
  AUTH_DB_PORT: "5432"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-secret}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-30}
  JWT_REFRESH_TOKEN_LIFETIME_DAYS: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}
  STAFF_EMAIL: ${STAFF_EMAIL:-staff@aurelia.example}
  STAFF_PASSWORD: ${STAFF_PASSWORD:-StaffPass123!}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  AUTH_EMAIL_BACKEND: ${AUTH_EMAIL_BACKEND:-django_ses.SESBackend}
  AUTH_EMAIL_HOST: ${AUTH_EMAIL_HOST:-}
  AUTH_EMAIL_PORT: ${AUTH_EMAIL_PORT:-587}
  AUTH_EMAIL_USE_TLS: ${AUTH_EMAIL_USE_TLS:-True}
  AUTH_EMAIL_HOST_USER: ${AUTH_EMAIL_HOST_USER:-}
  AUTH_EMAIL_HOST_PASSWORD: ${AUTH_EMAIL_HOST_PASSWORD:-}
  AUTH_DEFAULT_FROM_EMAIL: ${AUTH_DEFAULT_FROM_EMAIL:-noreply@aurelia.example}
  AUTH_PASSWORD_RESET_URL: ${AUTH_PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
  AUTH_PASSWORD_RESET_TOKEN_LIFETIME_MINUTES: ${AUTH_PASSWORD_RESET_TOKEN_LIFETIME_MINUTES:-30}
  AWS_SES_REGION_NAME: ${AWS_SES_REGION_NAME:-ap-south-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SES_CONFIGURATION_SET: ${AWS_SES_CONFIGURATION_SET:-}

services:
  auth_db:
    image: postgres:16-alpine
    container_name: auth_db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password}
    ports:
      - "${AUTH_DB_PORT:-5432}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth_user} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  catalog_db:
    image: postgres:16-alpine
    container_name: catalog_db
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalog_db}
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog_user}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_password}
    ports:
      - "${CATALOG_DB_PORT:-5433}:5432"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER:-catalog_user} -d ${CATALOG_DB_NAME:-catalog_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # --- Not in use yet (uncomment when inventory-service is added) ---
  # inventory_db:
  #   image: postgres:16-alpine
  #   container_name: inventory_db
  #   environment:
  #     POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory_db}
  #     POSTGRES_USER: ${INVENTORY_DB_USER:-inventory_user}
  #     POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_password}
  #   ports:
  #     - "${INVENTORY_DB_PORT:-5434}:5432"
  #   volumes:
  #     - inventory_db_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER:-inventory_user} -d ${INVENTORY_DB_NAME:-inventory_db}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - app_net

  # --- Not in use yet (uncomment when order-service is added) ---
  # order_db:
  #   image: postgres:16-alpine
  #   container_name: order_db
  #   environment:
  #     POSTGRES_DB: ${ORDER_DB_NAME:-order_db}
  #     POSTGRES_USER: ${ORDER_DB_USER:-order_user}
  #     POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_password}
  #   ports:
  #     - "${ORDER_DB_PORT:-5435}:5432"
  #   volumes:
  #     - order_db_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER:-order_user} -d ${ORDER_DB_NAME:-order_db}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - app_net

  # --- Not in use yet (uncomment when payment-service is added) ---
  # payment_db:
  #   image: postgres:16-alpine
  #   container_name: payment_db
  #   environment:
  #     POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_db}
  #     POSTGRES_USER: ${PAYMENT_DB_USER:-payment_user}
  #     POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_password}
  #   ports:
  #     - "${PAYMENT_DB_PORT:-5436}:5432"
  #   volumes:
  #     - payment_db_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USER:-payment_user} -d ${PAYMENT_DB_NAME:-payment_db}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - app_net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  auth-service:
    build:
      context: ./src/backend
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    environment:
      <<: *auth-service-env
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8001"
    depends_on:
      auth_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8001), 2); s.close()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - app_net
    restart: unless-stopped

  auth-worker:
    build:
      context: ./src/backend
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-worker
    command:
      [
        "celery",
        "-A",
        "auth_service",
        "worker",
        "-l",
        "info",
        "--concurrency=2",
      ]
    environment:
      <<: *auth-service-env
    depends_on:
      auth_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - app_net
    restart: unless-stopped

  catalog-service:
    build:
      context: ./src/backend
      dockerfile: services/catalog-service/Dockerfile
    container_name: catalog-service
    environment:
      CATALOG_SECRET_KEY: ${CATALOG_SECRET_KEY:-change-me-catalog-django-secret}
      CATALOG_DEBUG: ${CATALOG_DEBUG:-True}
      CATALOG_ALLOWED_HOSTS: ${CATALOG_ALLOWED_HOSTS:-localhost,127.0.0.1,catalog-service,admin.localhost,www.localhost}
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:-catalog_db}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog_user}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_password}
      CATALOG_DB_HOST: catalog_db
      CATALOG_DB_PORT: "5432"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ports:
      - "${CATALOG_SERVICE_PORT:-8002}:8002"
    depends_on:
      catalog_db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/products/', timeout=3)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - app_net
    restart: unless-stopped

  # --- Not in use yet (uncomment when inventory-service is implemented) ---
  # inventory-service:
  #   build:
  #     context: ./src/backend
  #     dockerfile: services/inventory-service/Dockerfile
  #   container_name: inventory-service
  #   depends_on:
  #     inventory_db:
  #       condition: service_healthy
  #   networks:
  #     - app_net

  # --- Not in use yet (uncomment when order-service is implemented) ---
  # order-service:
  #   build:
  #     context: ./src/backend
  #     dockerfile: services/order-service/Dockerfile
  #   container_name: order-service
  #   depends_on:
  #     order_db:
  #       condition: service_healthy
  #   networks:
  #     - app_net

  # --- Not in use yet (uncomment when payment-service is implemented) ---
  # payment-service:
  #   build:
  #     context: ./src/backend
  #     dockerfile: services/payment-service/Dockerfile
  #   container_name: payment-service
  #   depends_on:
  #     payment_db:
  #       condition: service_healthy
  #   networks:
  #     - app_net

  # --- Not in use yet (uncomment when notification-service is implemented) ---
  # notification-service:
  #   build:
  #     context: ./src/backend
  #     dockerfile: services/notification-service/Dockerfile
  #   container_name: notification-service
  #   depends_on:
  #     - redis
  #   networks:
  #     - app_net

  ui:
    build:
      context: ./src/ui
      dockerfile: Dockerfile
      args:
        # Empty = same-origin /api (works on both localhost and admin.localhost via nginx)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://admin.localhost}
        AUTH_SERVICE_URL: http://auth-service:8001
        CATALOG_SERVICE_URL: http://catalog-service:8002
    container_name: ui
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://admin.localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
      STORE_HOSTS: ${STORE_HOSTS:-localhost,127.0.0.1,www.localhost}
      AUTH_SERVICE_URL: http://auth-service:8001
      CATALOG_SERVICE_URL: http://catalog-service:8002
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    networks:
      - app_net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ui:
        condition: service_started
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    networks:
      - app_net

volumes:
  auth_db_data:
  catalog_db_data:
  # inventory_db_data:
  # order_db_data:
  # payment_db_data:
  redis_data:

networks:
  app_net:
    driver: bridge
