<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Verify your Aurelia email</title>
  </head>
  <body style="font-family: Georgia, 'Times New Roman', serif; color: #1a1a1a; line-height: 1.5; margin: 0; padding: 24px;">
    <p>Welcome to Aurelia.</p>
    <p>Your verification code is:</p>
    <p style="font-size: 28px; letter-spacing: 0.2em; font-weight: 700; margin: 16px 0;">{{ otp }}</p>
    <p style="color: #555;">
      This code expires in {{ lifetime_minutes }} minutes. If you did not create an account, you can ignore this email.
    </p>
  </body>
</html>
