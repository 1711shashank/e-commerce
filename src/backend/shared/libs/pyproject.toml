[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-shared"
version = "0.1.0"
description = "Shared utilities for e-commerce microservices (JWT validation, event schemas)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyJWT>=2.8.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ecommerce_shared*"]
